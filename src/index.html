<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Event Manager</title>
  <base href="/">

  <script>
    (function () {
      try {
        var k = 'eventmanager_theme';
        var s = localStorage.getItem(k);
        var theme =
          s === 'light' || s === 'dark'
            ? s
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', theme === 'dark' ? '#0f172a' : '#f3f4f6');
      } catch (e) {}
    })();
  </script>

  <!-- RESPONSIVIDADE (já tinha, mantido e correto) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Melhor compatibilidade mobile -->
  <meta name="theme-color" content="#f3f4f6">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Favicon -->
  <link rel="icon" href="logo-only.png" sizes="512x512" type="image/png">

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <app-root></app-root>
</body>
</html>
