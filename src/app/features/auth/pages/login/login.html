<section class="auth-container">
  <div class="auth-card">
    <h1>Login</h1>

    <form (ngSubmit)="submit()">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="Digite seu email" required />

      <label>Senha</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="Digite sua senha" required />

      <button type="submit">Entrar</button>
    </form>

    @if (errorMessage) {
      <p class="auth-footer">{{ errorMessage }}</p>
    }

    <p class="auth-footer">
      Não tem conta?
      <a routerLink="/register">Cadastre-se</a>
    </p>
  </div>
</section>
