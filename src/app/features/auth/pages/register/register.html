<section class="auth-container">
  <div class="auth-card">
    <h1>Criar conta</h1>
    <p class="subtitle">Preencha os dados para começar</p>
    <form (ngSubmit)="submit()">
      <label>Nome</label>
      <input type="text" [(ngModel)]="name" name="name" placeholder="Digite seu nome" required />

      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="Digite seu email" required />

      <label>Telefone</label>
      <input type="text" [(ngModel)]="phone" name="phone" placeholder="Digite seu telefone" />

      <label>Senha</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="Crie uma senha" required />

      <button type="submit">Cadastrar</button>
    </form>

    <p class="auth-footer">
      Já tem conta?
      <a routerLink="/login">Entrar</a>
    </p>
  </div>
</section>
