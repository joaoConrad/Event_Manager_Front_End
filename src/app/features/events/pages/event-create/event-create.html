<section class="event-form-page">
  <div class="event-form-card">
    <div class="form-header">
      <span class="form-kicker">Administração</span>
      <h1>{{ isEditMode ? 'Editar evento' : 'Novo evento' }}</h1>
      <p>
        {{ isEditMode
          ? 'Atualize as informações do evento.'
          : 'Preencha os dados para cadastrar um novo evento.' }}
      </p>
    </div>

    @if (errorMessage) {
      <div class="form-error">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="submit()" class="event-form">
      <div class="form-group">
        <label for="title">Título</label>
        <input id="title" name="title" [(ngModel)]="event.title" type="text" />
      </div>

      <div class="form-group">
        <label for="description">Descrição</label>
        <textarea
          id="description"
          name="description"
          [(ngModel)]="event.description"
          rows="4"></textarea>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="date">Data</label>
          <input id="date" name="date" [(ngModel)]="event.date" type="date" />
        </div>

        <div class="form-group">
          <label for="time">Horário</label>
          <input id="time" name="time" [(ngModel)]="event.time" type="time" />
        </div>
      </div>

      <div class="form-group">
        <label for="location">Local</label>
        <input id="location" name="location" [(ngModel)]="event.location" type="text" />
      </div>

      <div class="form-group">
        <label for="maxParticipants">Máximo de participantes</label>
        <input
          id="maxParticipants"
          name="maxParticipants"
          [(ngModel)]="event.maxParticipants"
          type="number"
          min="1" />
      </div>

      <div class="form-actions">
        <a routerLink="/events" class="secondary-btn">Cancelar</a>
        <button type="submit" class="primary-btn" [disabled]="loading">
          {{ loading ? 'Salvando...' : (isEditMode ? 'Atualizar evento' : 'Criar evento') }}
        </button>
      </div>
    </form>
  </div>
</section>
