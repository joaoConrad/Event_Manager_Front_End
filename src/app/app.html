<nav class="app-nav">
  <div class="nav-inner">

    <!-- LOGO -->
    <a routerLink="/home" class="nav-logo">
      <img src="/logo-horizontal.png" alt="Event Manager" class="nav-logo-img" />
    </a>

    <!-- LINKS -->
    <div class="nav-links">
  <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
    Início
  </a>

  <a routerLink="/events" routerLinkActive="active" class="nav-link">
    Eventos
  </a>

  <a routerLink="/news" routerLinkActive="active" class="nav-link">
    Avisos
  </a>
  
  <a routerLink="/minha-area" routerLinkActive="active" class="nav-link">
    Minha Área
  </a>

  @if (authService.isAdmin()) {
    <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-link">
      Dashboard
    </a>
  }
</div>

    <!-- AÇÕES -->
    <div class="nav-actions">
      <button
        type="button"
        class="btn-nav btn-nav-theme"
        (click)="theme.toggle()"
        [attr.title]="theme.isDark() ? 'Modo claro' : 'Modo escuro'"
        [attr.aria-label]="theme.isDark() ? 'Ativar modo claro' : 'Ativar modo escuro'"
      >
        @if (theme.isDark()) {
          <span aria-hidden="true">Claro</span>
        } @else {
          <span aria-hidden="true">Escuro</span>
        }
      </button>
      @if (authService.isLoggedIn()) {

        <!-- Avatar / link pro perfil -->
        <a routerLink="/profile" routerLinkActive="active" class="nav-avatar" title="Meu perfil">
          {{ getInitials() }}
        </a>

        @if (authService.isAdmin()) {
          <a routerLink="/events/new" class="btn-nav btn-nav-primary">+ Novo evento</a>
        }

        <button class="btn-nav btn-nav-ghost" (click)="logout()">Sair</button>

      } @else {
        <a routerLink="/login"    routerLinkActive="active" class="btn-nav btn-nav-ghost">Entrar</a>
        <a routerLink="/register" routerLinkActive="active" class="btn-nav btn-nav-primary">Criar conta</a>
      }
    </div>

  </div>
</nav>

<main class="app-main">
  <router-outlet />
</main>

<app-footer />
