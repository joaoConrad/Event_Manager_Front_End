<header class="topbar">
  <div class="topbar-container">
    <a routerLink="/home" class="brand">Event Manager</a>

    <nav class="topbar-nav">
      <a routerLink="/home">Home</a>
      <a routerLink="/events">Eventos</a>

      @if (authService.isLoggedIn() && authService.isAdmin()) {
        <a routerLink="/events/new">Novo evento</a>
      }
    </nav>

    <div class="topbar-actions">
      @if (!authService.isLoggedIn()) {
        <a routerLink="/login" class="nav-btn ghost">Entrar</a>
        <a routerLink="/register" class="nav-btn primary">Cadastrar</a>
      } @else {
        <span class="user-badge">
          {{ authService.getUser()?.name }}
          <small>({{ authService.getUser()?.role }})</small>
        </span>

        <button class="nav-btn danger" (click)="logout()">Sair</button>
      }
    </div>
  </div>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
