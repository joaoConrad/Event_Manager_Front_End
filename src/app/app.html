<header class="topbar">
  <div class="topbar-container">
    <a routerLink="/home" class="brand" aria-label="Ir para a home">
      <img src="logo-horizontal.png" alt="Event Manager" class="brand-logo" />
    </a>

    <nav class="topbar-nav">
      <a routerLink="/home" routerLinkActive="active-link">Home</a>
      <a routerLink="/events" routerLinkActive="active-link">Eventos</a>

      @if (authService.isLoggedIn() && authService.isAdmin()) {
        <a routerLink="/events/new" routerLinkActive="active-link">Novo evento</a>

        <!-- 🔥 DASHBOARD (SÓ ADMIN) -->
        <a routerLink="/admin/dashboard" routerLinkActive="active-link">Dashboard</a>
      }
    </nav>

    <div class="topbar-actions">
      @if (!authService.isLoggedIn()) {
        <a routerLink="/login" class="nav-btn nav-btn-ghost">Entrar</a>
        <a routerLink="/register" class="nav-btn nav-btn-primary">Cadastrar</a>
      } @else {
        <div class="user-badge">
          <div class="user-avatar">
            {{ authService.getUser()?.name?.charAt(0) }}
          </div>

          <div class="user-info">
            <span class="user-name">{{ authService.getUser()?.name }}</span>
            <small class="user-role">{{ authService.getUser()?.role }}</small>
          </div>
        </div>

        <button class="nav-btn nav-btn-outline" (click)="logout()">Sair</button>
      }
    </div>
  </div>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
